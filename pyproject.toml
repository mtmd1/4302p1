[project]
name = "kawase-presentation"
version = "0.1.0"
description = "Blur implementations and figures for the Dual Kawase presentation"
requires-python = ">=3.14"
dependencies = [
    "manim>=0.22",
    "moderngl>=5.13",
    "numpy>=2.3",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/blur.py"]
sources = ["src"]
